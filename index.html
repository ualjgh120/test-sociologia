<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="63 preguntas tipo test de Sociología (Sociedad, Familia y Educación), con modo estudio y modo examen.">
<title>Test de Sociología SFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}

/* Layout: una hoja de respuestas de examen; una pregunta a la vez con burbujas A/B/C y una tira de progreso tipo plantilla */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#18263A; --muted:#5B6878; --line:#D3DAE3;
  --accent:#2340A8; --accent-soft:#E3E8F8; --ok:#17784A; --ok-soft:#E1F3EA; --bad:#C2352B; --bad-soft:#FBE6E3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1520; --paper:#172030; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3649;
  --accent:#8FA6FF; --accent-soft:#1F2B4D; --ok:#5FD39A; --ok-soft:#14322A; --bad:#FF8577; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1520; --paper:#172030; --ink:#E6ECF4; --muted:#9AA7B8; --line:#2A3649;
  --accent:#8FA6FF; --accent-soft:#1F2B4D; --ok:#5FD39A; --ok-soft:#14322A; --bad:#FF8577; --bad-soft:#3A1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.score{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.04em}
.qtema{font-size:13px;color:var(--muted)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,2.6vw,23px);line-height:1.3;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;text-align:left;width:100%;
  font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--muted)}
.opt span:last-child{padding-top:5px;min-width:0}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.cell.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.why p{margin:0;max-width:65ch}
.src{font-size:14px;color:var(--muted)}
.src b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{font:700 15px var(--f-body);padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.hint kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.grid-title{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{font:700 12px var(--f-mono);font-variant-numeric:tabular-nums;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.end{display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,72px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.end ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.end li button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Sociedad, Familia y Educación · Sociología</span>
    <h1>Test de Sociología</h1>
  </header>

  <div class="controls" role="group" aria-label="Filtro por tema">
    <button class="chip" data-t="0" id="t0">Todos</button>
    <button class="chip" data-t="1" id="t1">Tema 1</button>
    <button class="chip" data-t="2" id="t2">Tema 2</button>
    <button class="chip" data-t="3" id="t3">Tema 3</button>
    <button class="chip" id="shuf" aria-pressed="false">Orden aleatorio</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="chip" id="mEst" aria-pressed="true">Modo estudio</button>
    <button class="chip" id="mExa" aria-pressed="false">Modo examen</button>
    <span class="spacer"></span>
    <span class="score" id="score"></span>
  </div>

  <main class="sheet" id="sheet" aria-live="polite"></main>

  <section style="display:flex;flex-direction:column;gap:8px">
    <p class="grid-title">Plantilla · pulsa un número para ir a esa pregunta</p>
    <div class="grid" id="grid"></div>
  </section>

  <div class="nav">
    <button class="btn ghost" id="reset">Empezar de cero</button>
    <span class="hint" id="modehint"></span>
    <span class="hint">Atajos: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> para responder · <kbd>Intro</kbd> siguiente</span>
  </div>
</div>

<script>
const P = [{"t": 1, "q": "Desde la perspectiva de Martín Criado, ¿qué significa entender la sociedad a partir de las interdependencias?", "o": ["Que las personas que forman una sociedad son semejantes entre sí y tienden a hacer las mismas cosas.", "Que nuestras acciones dependen de lo que hacen otras personas y, a su vez, las suyas dependen de las nuestras.", "Que cada individuo es el origen de sus propias decisiones y el único responsable de su destino."], "k": 1, "w": "Martín Criado define la sociología como «el estudio de las interdependencias entre personas»: dependemos de las acciones ajenas y los demás dependen de las nuestras. La A es la idea de «social = común» que él critica, y la C es la visión individualista que presenta como lo contrario de la sociología.", "s": "Martín Criado (2019), «¿Qué es la sociología? Sociedad e interdependencias», apartado «¿Qué es la sociología?»."}, {"t": 1, "q": "Según Martín Criado, ¿por qué hoy se necesitan más títulos que hace un siglo para acceder a un «buen empleo»?", "o": ["Porque los empleos actuales exigen conocimientos técnicos que el bachillerato ya no proporciona.", "Porque las empresas han acordado elevar los requisitos para reducir el número de candidatos.", "Porque, como los demás tienen cada vez más estudios, los títulos valen menos y todos necesitamos acumular más, un proceso que nadie ha diseñado."], "k": 2, "w": "Es su ejemplo de proceso regular producido por la interdependencia: el nivel de estudios que necesito depende del que tienen los demás. Nadie lo ha planificado (por eso la B, que habla de un acuerdo, es falsa) y no se explica por el contenido de los empleos (A), sino por la competencia entre todos.", "s": "Martín Criado (2019), «¿Qué es la sociología? Sociedad e interdependencias», ejemplo del aumento del nivel de estudios."}, {"t": 1, "q": "¿Cómo explica Martín Criado la separación progresiva entre centros escolares «buenos» y «malos»?", "o": ["Como una dinámica que se retroalimenta: unas familias con recursos se van, cambia la composición del centro que dejan y otras familias deciden marcharse también.", "Como el resultado de una decisión planificada por la administración educativa para ordenar los centros.", "Como una consecuencia de las diferencias de preparación entre el profesorado de unos centros y otros."], "k": 0, "w": "Las dinámicas las crean las personas, pero llega un momento en que nadie las controla: lo que hace cada familia afecta y es afectado por lo que hace el resto. La B atribuye el proceso a una voluntad planificada (justo lo que el autor desmonta) y la C no aparece en el texto.", "s": "Martín Criado (2019), «¿Qué es la sociología? Sociedad e interdependencias», ejemplo de la segregación de los centros escolares."}, {"t": 1, "q": "Según Martín Criado, ¿qué vertiente ética tiene pensar desde la interdependencia?", "o": ["La convicción de que cada persona ocupa la posición social que merece según su esfuerzo.", "La conciencia de que lo que hacemos no depende solo de nosotros y no nos afecta solo a nosotros.", "La idea de que la solidaridad consiste en ayudar de forma puntual a individuos ajenos que lo necesitan."], "k": 1, "w": "El texto dice que la interdependencia tiene una vertiente cognitiva (la sociología) y otra ética: nuestros actos no dependen solo de nosotros ni nos afectan solo a nosotros. La A es la ideología individualista que «legitima toda desigualdad como merecida», y la C es justo la idea de solidaridad que el autor corrige: no simple ayuda, sino conciencia del lugar que ocupamos en el entramado.", "s": "Martín Criado (2019), «¿Qué es la sociología? Sociedad e interdependencias», apartado «Interdependencia como posición ética y política»."}, {"t": 1, "q": "El estudio de Christakis y Fowler sobre las personas que dejan de fumar, citado por Martín Criado, muestra que:", "o": ["Dejar de fumar depende sobre todo de la fuerza de voluntad de cada fumador.", "Las campañas de salud pública son el factor que más influye en el abandono del tabaco.", "La probabilidad de dejarlo aumenta cuantas más personas de nuestra red cotidiana lo dejan."], "k": 2, "w": "Las personas no dejaron de fumar de forma aislada, sino en grupo y de manera escalonada: primero una, luego su pareja, un amigo… «Fumar no es un simple asunto individual». La A es la explicación individualista que el autor critica y la B no aparece en el texto.", "s": "Martín Criado (2019), «¿Qué es la sociología? Sociedad e interdependencias», ejemplo de Christakis y Fowler."}, {"t": 1, "q": "¿Qué papel tuvo la Ilustración en el nacimiento de la sociología?", "o": ["Promovió el uso de la razón y la observación para comprender el mundo social, frente a las explicaciones religiosas.", "Reforzó las explicaciones religiosas de la sociedad propias de la Edad Media.", "Puso en marcha las primeras encuestas estadísticas sobre las condiciones de vida obreras."], "k": 0, "w": "El manual sitúa las raíces de la sociología en la Ilustración (Montesquieu, Rousseau, Voltaire), que impulsó la razón y la observación «en detrimento y huida» de las explicaciones religiosas. La B dice lo contrario y la C no está en el material.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.2 «¿Cuándo y por qué nace la sociología?»."}, {"t": 1, "q": "En el ejemplo del manual de las sillas orientadas hacia la pizarra, ¿qué nos invita a hacer la sociología?", "o": ["A aceptar esa disposición porque es la que ha demostrado ser más eficaz para aprender.", "A cuestionar una organización naturalizada que refleja una estructura de poder y control del conocimiento.", "A sustituir siempre las filas por una disposición en círculo en todas las aulas."], "k": 1, "w": "Nos sentamos mirando a la pizarra «sin pensarlo»; la sociología pregunta por qué y si esa disposición favorece realmente el aprendizaje o hay alternativas. La A da por buena la costumbre sin cuestionarla y la C es una receta cerrada: la sociología pregunta, no impone.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.3 (ejemplo de la sala con las sillas mirando a la pizarra)."}, {"t": 1, "q": "En una investigación sociológica, ¿en qué fase se construyen los antecedentes y el marco teórico?", "o": ["En el análisis e interpretación de los datos.", "En las conclusiones y la redacción del informe.", "En la revisión bibliográfica."], "k": 2, "w": "La revisión bibliográfica es el análisis crítico de estudios previos para construir los antecedentes (qué se ha estudiado y qué vacíos hay) y elaborar el marco teórico. Las otras dos fases son posteriores: procesar los datos y sintetizar los hallazgos.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.5 «Fases de investigación», fase 2."}, {"t": 1, "q": "¿Qué diferencia principalmente a las técnicas cuantitativas de las cualitativas?", "o": ["Las cuantitativas recogen datos numéricos para identificar patrones y generalizar; las cualitativas exploran en profundidad significados y experiencias desde quienes los viven.", "Las cuantitativas se basan en entrevistas y grupos de discusión; las cualitativas, en encuestas con preguntas cerradas.", "Las cuantitativas son científicas y objetivas; las cualitativas recogen opiniones sin ningún tipo de rigor."], "k": 0, "w": "Es la definición del manual (Bryman, 2012; Denzin y Lincoln, 2018). La B intercambia las técnicas y la C es falsa: ambas son métodos de investigación y el manual las presenta como complementarias.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.6 «Técnicas de investigación»."}, {"t": 1, "q": "Un equipo quiere comprobar una relación de causa y efecto manipulando una variable independiente en condiciones controladas. ¿Qué técnica utiliza?", "o": ["El grupo focal.", "El experimento.", "La historia de vida."], "k": 1, "w": "El cuadro del manual define el experimento como la manipulación de variables independientes para observar su efecto en una dependiente bajo condiciones controladas, «permitiendo establecer causalidad». El grupo focal y la historia de vida son técnicas cualitativas que buscan significados, no causalidad.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.6, cuadro «Principales técnicas cuantitativas»."}, {"t": 1, "q": "Una investigadora recoge de forma detallada la trayectoria de una maestra jubilada para comprender cómo ha cambiado la escuela. ¿Qué técnica emplea?", "o": ["La historia de vida.", "La encuesta.", "El análisis de redes sociales."], "k": 0, "w": "La historia de vida es la recopilación detallada de la experiencia de una persona para comprender procesos sociales desde una perspectiva individual. La encuesta busca datos de muchas personas con cuestionarios, y el análisis de redes estudia nodos y enlaces.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.6, cuadro «Principales técnicas cualitativas»."}, {"t": 1, "q": "¿Qué consecuencia tiene que, en sociología, quienes investigan formen parte de la misma realidad que estudian?", "o": ["Que sus resultados son universales y válidos para cualquier época y lugar.", "Que no pueden investigar fenómenos de su propia sociedad.", "Que sus experiencias y valores pueden introducir sesgos en la interpretación de los datos."], "k": 2, "w": "Es el desafío de la subjetividad: la proximidad entre investigador e investigado puede introducir sesgos (por ejemplo, proyectar las propias creencias al estudiar la desigualdad de género). La A contradice la provisionalidad de los resultados y la B no tiene base en el material.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.7 «La sociología como ciencia social: particularidades y desafíos»."}, {"t": 1, "q": "Para Durkheim, ¿qué es un hecho social?", "o": ["Un sentimiento personal que cada individuo vive de forma única e intransferible.", "Una institución o norma que existe con independencia del individuo y que acota o canaliza su comportamiento.", "Una decisión racional que cada persona toma calculando la eficiencia de sus acciones."], "k": 1, "w": "Los hechos sociales existen antes que nosotros y nos obligan, como el sistema monetario: «estudia los hechos sociales como si fueran cosas». La A es una explicación psicológica, justo la que Durkheim rechaza, y la C se acerca a la acción racional de Weber.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, p. 41; Vuestra clase invertida del Tema 1, diapositiva de Durkheim."}, {"t": 1, "q": "¿Qué pretendía demostrar Durkheim con su estudio del suicidio?", "o": ["Que incluso un acto aparentemente personal sigue pautas regulares que se explican por hechos sociales como la religión, el matrimonio o la clase social.", "Que el suicidio se debe únicamente a la infelicidad extrema o a la depresión de cada persona.", "Que los fenómenos sociales no pueden estudiarse con métodos científicos."], "k": 0, "w": "Si los países muestran pautas regulares distintas, hay que explicarlas «de una manera sociológica, no psicológica». La B es la explicación psicológica que Durkheim supera y la C es lo contrario de lo que su estudio demuestra.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, pp. 41-44."}, {"t": 1, "q": "Según Durkheim, ¿qué diferencia a la solidaridad orgánica de la mecánica?", "o": ["La orgánica es propia de las sociedades tradicionales, en las que todos realizan ocupaciones parecidas.", "La orgánica se basa en que todos comparten exactamente las mismas creencias y experiencias.", "La orgánica surge con la especialización y la división del trabajo, que hacen que cada persona dependa cada vez más de los demás."], "k": 2, "w": "En las culturas tradicionales, con poca división del trabajo, hay solidaridad mecánica (nos une parecernos). La industria amplía la división del trabajo y aparece la orgánica (nos une necesitarnos). La A y la B describen en realidad la solidaridad mecánica.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, pp. 44-45; Macionis y Plummer, cap. 4, p. 104."}, {"t": 1, "q": "¿A qué llamó Durkheim anomia?", "o": ["A la sensación de falta de sentido que aparece cuando el cambio social es tan rápido que las personas abandonan los antiguos valores antes de incorporar otros nuevos.", "Al enfrentamiento entre clases sociales con intereses económicos contrapuestos.", "A la «jaula de acero» en la que la burocracia encierra al ser humano."], "k": 0, "w": "La anomia es la sensación de falta de sentido, de desesperación, cuando el cambio es rápido y continuo y la vida cotidiana parece carecer de estructura. La B es el conflicto de clases de Marx y la C es la imagen de Weber.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, p. 45."}, {"t": 1, "q": "Según Marx, ¿cómo es la relación entre capitalistas y trabajadores?", "o": ["Una relación equilibrada, porque ambas partes se necesitan por igual.", "Una dependencia mutua muy desequilibrada, en la que los empresarios se apropian de lo que producen los trabajadores pagándoles menos de lo que vale su trabajo.", "Una relación basada en tradiciones antiguas y obligaciones personales, como la de nobles y siervos."], "k": 1, "w": "Los capitalistas necesitan mano de obra y los trabajadores un salario, pero esa dependencia «está muy desequilibrada». La A ignora el desequilibrio y la C describe el feudalismo: Marx dice precisamente que el capitalismo disolvió esos lazos tradicionales.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, pp. 45-46; Macionis y Plummer, cap. 4, p. 97."}, {"t": 1, "q": "En el modelo de sociedad de Marx, ¿dónde se sitúa la escuela?", "o": ["En la infraestructura económica, junto al trabajo y la propiedad.", "Fuera de ese modelo, porque la educación es independiente de la economía.", "En la superestructura, que descansa sobre la infraestructura económica."], "k": 2, "w": "Para Marx la economía (trabajo, propiedad, producción) es la base o infraestructura, y sobre ella se construyen la escuela, las leyes y las ideas (superestructura), que tienden a apoyar el sistema económico. Por eso la escuela no es independiente de la economía.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Macionis y Plummer, cap. 4, p. 96 (figura 4.2); Vuestra clase invertida del Tema 1, diapositiva de Marx."}, {"t": 1, "q": "Cuando Weber habla de «tipo ideal», ¿a qué se refiere?", "o": ["A un modelo perfecto y deseable que las instituciones deberían intentar alcanzar.", "A un modelo «puro» construido a partir de los rasgos más notables de casos reales, que sirve para compararlos.", "Al caso real más representativo, que se toma como ejemplo para todos los demás."], "k": 1, "w": "Weber aclara que «ideal» no significa perfecto ni deseable (A), sino una forma pura de un fenómeno. Y añade que es más eficaz usar un tipo ideal que tomar un caso real como modelo para los otros (C).", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, p. 47."}, {"t": 1, "q": "¿Qué temía Weber del avance de la racionalización en la sociedad moderna?", "o": ["Que la burocracia, basada en la eficiencia, encerrara al ser humano en una «jaula de acero» que ahogara su creatividad.", "Que la sociedad volviera a explicarse mediante la religión y la superstición.", "Que el conflicto de clases desembocara en una revolución obrera."], "k": 0, "w": "Weber veía la racionalización (ciencia, técnica y burocracia al servicio de la eficiencia) como un proceso con peligros ocultos: el dominio burocrático podía aplastar el espíritu humano. La B es lo contrario de la racionalización y la C pertenece a Marx.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, pp. 47-48."}, {"t": 1, "q": "¿En qué se aparta Weber del análisis de Marx al explicar la sociedad moderna?", "o": ["En que Weber niega que la economía y la tecnología influyan en el cambio social.", "En que Weber considera que el conflicto de clases es el verdadero motor de la historia.", "En que, para Weber, las ideas, como las creencias religiosas de la ética protestante, también tienen poder de transformación."], "k": 2, "w": "Weber reconocía el peso de la economía (por eso la A es falsa), pero se apartó del análisis materialista de Marx: la sociedad moderna es también fruto de una nueva manera de pensar. La B es la tesis de Marx.", "s": "Manual fotografiado («06 Sociología - fotos ordenadas»), Giddens y Sutton, cap. 1, p. 47; Macionis y Plummer, cap. 4, p. 99."}, {"t": 1, "q": "¿Qué plantea Giddens con su idea de estructuración?", "o": ["Que las estructuras sociales lo deciden todo y las personas se limitan a obedecerlas.", "Que las normas nos limitan, pero existen porque las repetimos, de modo que al actuar las reproducimos o las cambiamos.", "Que las personas son completamente libres y las estructuras sociales no influyen en lo que hacen."], "k": 1, "w": "Giddens busca un punto intermedio: ni la estructura lo decide todo (A) ni somos libres del todo (C). Estructura y acción se influyen mutuamente.", "s": "Vuestra clase invertida del Tema 1, diapositiva de Giddens (autor obligatorio de la guía del Tema 1)."}, {"t": 1, "q": "¿Qué aportó James Coleman a la sociología de la educación y la familia?", "o": ["Analizó la relación entre familia y educación y mostró que el entorno familiar influye en el rendimiento académico.", "Introdujo el concepto de «capital cultural» para explicar el éxito escolar.", "Estudió cómo el lenguaje de las distintas clases sociales afecta al rendimiento escolar."], "k": 0, "w": "Es la aportación que el manual atribuye a Coleman (1990). La B corresponde a Bourdieu y la C a Bernstein, los otros dos autores de la misma lista.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.8 «Principales sociólogos de la educación y la familia»."}, {"t": 1, "q": "¿Por qué el manual afirma que casi todos los sociólogos clásicos citados son hombres?", "o": ["Porque las mujeres no se interesaron por el estudio de la sociedad hasta finales del siglo XX.", "Porque las mujeres tuvieron menos acceso a la universidad y a la producción científica, y sus aportaciones fueron invisibilizadas o atribuidas a colegas hombres.", "Porque las aportaciones de las mujeres se limitaron al trabajo social y no a la sociología."], "k": 1, "w": "En los siglos XIX y XX muchas universidades restringían el acceso a las mujeres o no reconocían su trabajo. La A es falsa (Martineau, Addams o Smith lo desmienten) y la C también: Martineau analizó la desigualdad de género y la economía política, y Smith desarrolló la sociología feminista.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.8."}, {"t": 1, "q": "En el ejemplo del manual, en casa se enseña a respetar a los mayores sin cuestionarlos y en la escuela, a pensar críticamente. ¿Qué estudia aquí la sociología?", "o": ["Qué institución tiene razón para imponer su criterio sobre la otra.", "Los trastornos psicológicos que provoca en el alumnado recibir mensajes contradictorios.", "Las tensiones entre la educación y los valores familiares y cómo influyen en la identidad y la socialización."], "k": 2, "w": "La sociología de la educación y la familia analiza estas tensiones (Coleman, 1990) y cómo afectan a la construcción de la identidad. No juzga quién tiene razón (A) ni se centra en lo psicológico (B).", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 1.9 «Relación entre sociología, educación y familia»."}, {"t": 2, "q": "¿Qué significa que las culturas son relacionales?", "o": ["Que cada cultura se ha desarrollado de forma aislada y conserva intactas sus tradiciones.", "Que las sociedades han desarrollado sus culturas relacionándose unas con otras, por lo que no son cerradas.", "Que una cultura solo puede entenderse comparándola con la cultura dominante."], "k": 1, "w": "Es una de las características que el manual destaca: las culturas no son cerradas, sino relacionales, y además son dinámicas. La A niega ambas ideas y la C contradice el relativismo cultural.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.1 «La cultura» (características)."}, {"t": 2, "q": "¿Qué quiere decir que la cultura cumple una función adaptativa?", "o": ["Que permite a los grupos desarrollar prácticas para responder a las condiciones de su entorno, como combinar cereales y legumbres en la alimentación.", "Que las personas se adaptan biológicamente al clima del lugar donde nacen.", "Que la cultura impide que las sociedades cambien con el paso del tiempo."], "k": 0, "w": "El Complementario lo ilustra con las prácticas alimentarias: combinar cereales y legumbres permite una alimentación equilibrada; la cultura actúa como mecanismo de adaptación (Malinowski, 1944). La B confunde cultura con biología y la C va contra el carácter dinámico de la cultura.", "s": "Tema 2, «Complementario», apartado 1.1 «El ser humano como ser cultural»."}, {"t": 2, "q": "¿Cómo es la relación entre individuo y cultura según el Complementario?", "o": ["La cultura determina por completo a las personas, que no pueden modificarla.", "Cada individuo crea su propia cultura al margen del grupo en el que vive.", "Es una influencia recíproca: la cultura modela a las personas, pero estas la reproducen, la transforman y la transmiten."], "k": 2, "w": "El texto habla de «una relación de influencia recíproca entre individuo y cultura». La A elimina la capacidad de transformarla y la B olvida que la cultura se adquiere en la comunidad.", "s": "Tema 2, «Complementario», apartado 1.1."}, {"t": 2, "q": "¿Qué diferencia la aculturación del colonialismo cultural?", "o": ["En la aculturación se incorporan elementos de otra cultura por el contacto continuado; en el colonialismo cultural, una cultura dominante impone los suyos y desplaza los de los grupos subordinados.", "La aculturación solo se produce por la fuerza, mientras que el colonialismo cultural es siempre voluntario.", "Son sinónimos: ambos designan la desaparición total de una cultura."], "k": 0, "w": "La aculturación surge del contacto (migraciones, globalización) y puede dar lugar a intercambio y adaptación; el colonialismo cultural implica imposición, como en la colonización de América. La B invierte los conceptos y la C los iguala.", "s": "Tema 2, «Complementario», apartado 1.3 «Procesos de aculturación y colonialismo cultural»."}, {"t": 2, "q": "Según el manual, ¿qué son los productos culturales?", "o": ["Solo las obras de arte expuestas en museos y reconocidas por los expertos.", "Bienes materiales o servicios que reflejan y transmiten manifestaciones culturales, elaborados por la industria cultural con contenido simbólico.", "Objetos cotidianos que tienen únicamente una función práctica."], "k": 1, "w": "Libros, películas, música, artesanías… son productos culturales con contenidos simbólicos destinados al consumo. La A es demasiado restrictiva y la C olvida su valor simbólico, que el manual subraya.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.1."}, {"t": 2, "q": "Las leyes de tráfico, cuyo incumplimiento conlleva sanciones legales, son un ejemplo de:", "o": ["Norma informal.", "Valor.", "Norma formal."], "k": 2, "w": "Las normas formales son leyes y regulaciones oficiales sancionadas legalmente; el manual pone las leyes de tránsito como ejemplo. Las informales (saludar) solo provocan desaprobación social y los valores son guías generales de lo deseable.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.2 «Elementos de la cultura»."}, {"t": 2, "q": "La familia, la escuela, la religión o el gobierno, entendidos como estructuras organizadas que satisfacen necesidades básicas de la sociedad, son:", "o": ["Instituciones sociales.", "Artefactos.", "Símbolos."], "k": 0, "w": "Las instituciones sociales establecen patrones de comportamiento y roles que contribuyen al orden social. Los artefactos son objetos materiales (pirámides, cerámica) y los símbolos, objetos o gestos con un significado compartido (una bandera).", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.2."}, {"t": 2, "q": "Una familia puede irse de vacaciones cada verano y otra no llega a fin de mes. Según el manual, entre ellas hay:", "o": ["Una simple diferencia, como la que existe entre una silla de madera y otra de metal.", "Una desigualdad, porque están en una relación asimétrica dentro de una escala social.", "Diversidad cultural, porque cada familia tiene su propia historia y costumbres."], "k": 1, "w": "Cuando hablamos de acceso a bienes, no son familias diferentes sin más: están en una relación asimétrica, y eso es desigualdad. El ejemplo de las sillas es el de la simple diferencia, y la diversidad cultural se refiere a lenguas, creencias o formas de organizarse.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.3 (igualdad, diferencia, diversidad y desigualdad)."}, {"t": 2, "q": "¿Por qué advierte el manual que valorar la diversidad no es lo mismo que naturalizarla?", "o": ["Porque la diversidad cultural es siempre negativa para la convivencia.", "Porque naturalizar la diversidad obliga a que todas las culturas sean iguales.", "Porque tras muchas diferencias se esconden relaciones de desigualdad que, al naturalizarlas, dejamos de ver."], "k": 2, "w": "La desigualdad se justifica a menudo con representaciones basadas en rasgos biológicos o culturales; si naturalizamos las diferencias, no vemos la jerarquía que esconden. La A y la B no aparecen en el manual.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.3."}, {"t": 2, "q": "¿Qué significa, según Rocher, que la socialización integra la cultura en la personalidad?", "o": ["Que lo aprendido deja de ser externo y se vive como natural, funcionando como criterio interno de juicio y obligación moral.", "Que la personalidad viene determinada por la herencia biológica de cada persona.", "Que la persona memoriza las normas sociales, aunque las siga sintiendo como algo ajeno."], "k": 0, "w": "Es el segundo rasgo de la socialización: parte de los elementos aprendidos pasan a los esquemas mentales del sujeto y orientan su conducta. La B contradice que sea un proceso social y la C es justo lo contrario de interiorizar.", "s": "Tema 2, «Complementario», apartado 2 «La socialización»."}, {"t": 2, "q": "Un adolescente entra en el equipo deportivo del instituto y aprende disciplina, trabajo en equipo y competitividad, valores que pueden diferir de los de su casa. Es un ejemplo de:", "o": ["Socialización primaria.", "Socialización secundaria.", "Resocialización."], "k": 1, "w": "Es el ejemplo del manual: al integrarse en nuevos grupos y contextos más amplios se adquieren roles y normas específicos. No es primaria (familia, primera infancia) ni resocialización, porque no abandona sus pautas anteriores.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.4 «Procesos de socialización»."}, {"t": 2, "q": "Según investigaciones recientes recogidas en el Complementario (Denham et al., 2024), la socialización emocional que ejerce el profesorado:", "o": ["Influye directamente en competencias del alumnado como la regulación emocional, la empatía o las habilidades sociales.", "Tiene poca importancia, porque la escuela solo transmite conocimientos formales.", "Sustituye a la familia como agente primario de socialización."], "k": 0, "w": "La escuela, además de conocimientos, inculca normas y pautas, y la socialización emocional del profesorado refuerza la integración social del alumnado. La B contradice el texto y la C también: la familia sigue siendo el agente primario.", "s": "Tema 2, «Complementario», apartado 2.1 «Agentes de socialización»."}, {"t": 2, "q": "¿Qué papel atribuye el manual a la escuela en la socialización de género?", "o": ["Transmite solo contenidos neutros, por lo que no interviene en los roles de género.", "Es el primer núcleo donde se aprenden los roles de género.", "Refuerza y, en ocasiones, desafía los roles de género tradicionales a través del currículo, las relaciones entre iguales y la conducta del profesorado."], "k": 2, "w": "La escuela moldea percepciones sobre el género, tanto para reforzarlas como para cuestionarlas. La A niega su papel y la B corresponde a la familia, que es el primer núcleo.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.6 «Socialización de género»."}, {"t": 2, "q": "Según el manual, ¿qué impacto tienen redes como Instagram o TikTok en la identidad de los adolescentes?", "o": ["La exposición constante a ideales y estándares puede afectar a su autoimagen y a su autoestima.", "No influyen en la identidad, porque solo sirven como entretenimiento.", "Refuerzan siempre la autoestima, porque permiten compartir logros personales."], "k": 0, "w": "El manual señala que Instagram y TikTok influyen en la autoimagen y en la percepción del éxito social, y que la exposición a ideales puede afectar a la autoestima, sobre todo en la adolescencia. La B y la C no se sostienen con el material.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartados 2.7 y 2.8 (nuevos agentes de socialización)."}, {"t": 2, "q": "¿Qué describe Bauman con el concepto de «amor líquido»?", "o": ["Relaciones sólidas y duraderas, basadas en el compromiso a largo plazo.", "Relaciones frágiles, efímeras y fácilmente desechables, marcadas por el individualismo y la lógica consumista.", "Relaciones a distancia que se mantienen solo a través de la mensajería instantánea."], "k": 1, "w": "Es una característica de la modernidad líquida: los vínculos pierden solidez y las personas se perciben como bienes de consumo. El manual pone Tinder como ejemplo. La A es lo contrario y la C no es la definición.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.8 «Impacto de los nuevos agentes de socialización»."}, {"t": 2, "q": "Tras romper una relación, una persona sigue viendo las historias de su expareja y dándole «me gusta», pero sin retomar el contacto directo. Según el manual, esto es:", "o": ["Ghosting.", "Love bombing.", "Orbiting."], "k": 2, "w": "El orbiting consiste en seguir interactuando de forma superficial en redes tras interrumpir la relación. El ghosting es cortar toda comunicación sin explicaciones y el love bombing, abrumar con muestras de afecto al principio para ganar confianza.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.8 (nuevos conceptos de relación)."}, {"t": 2, "q": "Según el Complementario, ¿por qué las redes sociales tienden a dar más visibilidad a las noticias conflictivas o polémicas?", "o": ["Porque generan más reacciones e interacciones, lo que puede aumentar la crispación social.", "Porque la ley obliga a las plataformas a priorizar la información de actualidad.", "Porque los usuarios las buscan de forma voluntaria más que cualquier otro contenido."], "k": 0, "w": "Las redes favorecen lo polémico porque genera interacción, lo que refuerza la exposición a ciertos puntos de vista y reduce el contacto con perspectivas diferentes. La B y la C no aparecen en el texto.", "s": "Tema 2, «Complementario», apartado 3 «Burbujas informativas»."}, {"t": 2, "q": "¿Por qué son importantes las burbujas informativas para la educación?", "o": ["Porque garantizan que el alumnado reciba información adaptada a sus intereses y aprenda más.", "Porque pueden dificultar que el alumnado contraste información y cuestione sus propias ideas, limitando su pensamiento crítico.", "Porque eliminan la desinformación al filtrar los contenidos falsos."], "k": 1, "w": "El Complementario recoge cuatro riesgos: pensamiento crítico, diversidad de perspectivas, desinformación y convivencia. La A presenta como ventaja lo que es un problema y la C es lo contrario: pueden favorecer las noticias falsas.", "s": "Tema 2, «Complementario», apartado 3, «¿Por qué son importantes para la educación?»."}, {"t": 2, "q": "Desde la sociología, ¿cómo se entiende el discurso de odio?", "o": ["Como cualquier opinión crítica con las instituciones o el gobierno.", "Como un conflicto individual entre dos personas que no afecta a la cohesión social.", "Como toda expresión que incita a la violencia, el desprecio o la discriminación hacia personas o grupos por su raza, religión, género, orientación sexual u otra condición."], "k": 2, "w": "Estos discursos perpetúan desigualdades, refuerzan estructuras de poder excluyentes y amenazan la cohesión social, por eso la B es falsa. La A confunde crítica con odio.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.10 «La escuela frente a los discursos de odio y la polarización social»."}, {"t": 2, "q": "Según el manual, ¿cuál de estos es un aspecto negativo de las TIC en el aula?", "o": ["El desarrollo de habilidades digitales.", "La dependencia tecnológica, que puede afectar a habilidades básicas como la escritura manual o el cálculo mental.", "El acceso a información actualizada."], "k": 1, "w": "El manual enumera como negativos las distracciones, la brecha digital, la reducción de la interacción social y la dependencia tecnológica. La A y la C están en la lista de aspectos positivos.", "s": "Manual (Ainz, Calabresi y Godino, 2025), apartado 2.9 «Las TIC en los procesos de socialización»."}, {"t": 3, "q": "¿Qué relación existe entre la estratificación social y la desigualdad social?", "o": ["La desigualdad social es una consecuencia directa de los procesos de estratificación.", "Son fenómenos independientes: puede haber estratificación sin que exista ninguna desigualdad.", "La estratificación es una consecuencia de las diferencias individuales de talento."], "k": 0, "w": "La estratificación establece jerarquías y reparte de forma desigual recursos, prestigio y poder; de ahí nace la desigualdad, entendida como diferencias en el acceso a recursos y oportunidades. La C explica la desigualdad por el individuo, no por la estructura.", "s": "Tema 3, documento «Estratificación social» (apartado 4 «Estructuras comunitarias»)."}, {"t": 3, "q": "En el documento sobre estratificación, ¿cómo se definen las clases sociales?", "o": ["Como grupos de personas que comparten las mis const TEMAS = {1:"Tema 1 · La sociología como herramienta", 2:"Tema 2 · Cultura y socialización", 3:"Tema 3 · Escuela y desigualdades"};
const L = "ABC";
// Orden de las respuestas: se mezcla en cada carga y en cada intento. Las respuestas se guardan con el índice original.
let perm = {};
function mix(){ perm = {}; P.forEach((p,i)=>{ const a=[0,1,2]; for(let x=2;x>0;x--){const y=Math.floor(Math.random()*(x+1)); [a[x],a[y]]=[a[y],a[x]];} perm[i]=a; }); }
const pos = (i, orig) => perm[i].indexOf(orig);              // letra que ve el alumno para una opción original
const why = (i, txt) => txt.replace(/([Ll]a |\()([ABC])\b/g, (m, pre, l) => pre + L[pos(i, L.indexOf(l))]);
const KEY = "test-socio-v2";
let st = {tema:0, shuffle:false, order:[], pos:0, ans:{}, mode:"estudio", corregido:false};   // ans: id -> índice elegido

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.order) st = s; }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function buildOrder(onlyIds){
  let ids = onlyIds || P.map((p,i)=>i).filter(i => st.tema===0 || P[i].t===st.tema);
  if(st.shuffle){ ids = ids.slice(); for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]];} }
  st.order = ids; st.pos = 0; st.corregido = false; mix();
}
function counts(){
  let ok=0, bad=0; st.order.forEach(i=>{ if(i in st.ans){ st.ans[i]===P[i].k ? ok++ : bad++; } });
  return {ok,bad,done:ok+bad,total:st.order.length};
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

const showing = () => st.mode==="estudio" || st.corregido;
function render(){
  document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.t===st.tema)));
  document.getElementById("shuf").setAttribute("aria-pressed", String(st.shuffle));
  document.getElementById("mEst").setAttribute("aria-pressed", String(st.mode==="estudio"));
  document.getElementById("mExa").setAttribute("aria-pressed", String(st.mode==="examen"));
  document.getElementById("modehint").textContent = st.mode==="estudio" ? "Estudio: se corrige cada pregunta al momento." : (st.corregido ? "Examen corregido: revisa cada pregunta." : "Examen: puedes cambiar tus respuestas; se corrige al final.");
  const c = counts();
  document.getElementById("score").innerHTML = showing() ? `<b>${c.ok}</b> bien · <b>${c.bad}</b> mal · ${c.done}/${c.total}` : `<b>${c.done}</b>/${c.total} respondidas`;
  const grid = document.getElementById("grid");
  grid.innerHTML = st.order.map((i,n)=>{
    const cls = (i in st.ans) ? (showing() ? (st.ans[i]===P[i].k?"ok":"bad") : "sel") : "";
    return `<button class="cell ${cls} ${n===st.pos&&st.pos<st.order.length?"cur":""}" data-n="${n}" aria-label="Pregunta ${n+1}">${n+1}</button>`;
  }).join("");
  const sheet = document.getElementById("sheet");
  if(st.pos >= st.order.length){ renderEnd(sheet, c); save(); return; }
  const i = st.order[st.pos], p = P[i], a = st.ans[i], answered = (a !== undefined) && showing(), locked = answered || st.corregido;
  let h = `<div class="qhead"><span class="qnum">PREGUNTA ${st.pos+1} DE ${st.order.length}</span><span class="qtema">${TEMAS[p.t]}</span></div>
    <p class="q">${esc(p.q)}</p><div class="opts">`;
  perm[i].forEach((j,d)=>{
    const o = p.o[j];
    let cls = "";
    if(answered){ if(j===p.k) cls="ok"; else if(j===a) cls="bad"; else cls="dim"; }
    else if(st.corregido){ cls = j===p.k ? "ok" : "dim"; }
    else if(j===a){ cls="sel"; }
    h += `<button class="opt ${cls}" data-j="${j}" ${locked?"disabled":""}><span class="bub">${L[d]}</span><span>${esc(o)}</span></button>`;
  });
  h += `</div>`;
  if(st.corregido && a===undefined){
    h += `<div class="why"><p class="verdict bad">Sin responder · la buena es la ${L[pos(i,p.k)]}</p>
      <p><b>Por qué:</b> ${esc(why(i,p.w))}</p><p class="src"><b>De dónde sale:</b> ${esc(p.s)}</p></div>`;
  }
  if(answered){
    const good = a===p.k;
    h += `<div class="why"><p class="verdict ${good?"ok":"bad"}">${good?"Correcta":"Incorrecta · la buena es la "+L[pos(i,p.k)]}</p>
      <p><b>Por qué:</b> ${esc(why(i,p.w))}</p><p class="src"><b>De dónde sale:</b> ${esc(p.s)}</p></div>`;
  }
  h += `<div class="nav"><button class="btn ghost" id="prev" ${st.pos===0?"disabled":""}>Anterior</button>
        <button class="btn" id="next">${st.pos===st.order.length-1?"Ver resultado":"Siguiente"}</button></div>`;
  sheet.innerHTML = h;
  save();
}
function renderEnd(sheet, c){
  if(!showing()){
    const pend = c.total - c.done;
    sheet.innerHTML = `<div class="end"><span class="qnum">FIN DEL EXAMEN</span><p class="big">${c.done}<span style="font-size:.4em;color:var(--muted)"> / ${c.total}</span></p>
      <p>${pend ? `Te quedan ${pend} preguntas sin responder. Puedes volver a ellas desde la plantilla o corregir ya.` : "Has respondido todas las preguntas."}</p>
      <div class="nav"><button class="btn ghost" id="prev">Volver a la última</button><button class="btn" id="corregir">Corregir examen</button></div></div>`;
    return;
  }
  const fails = st.order.filter(i => (i in st.ans) && st.ans[i]!==P[i].k);
  const pend = st.order.filter(i => !(i in st.ans)).length;
  const nota = c.total ? (10*c.ok/c.total).toFixed(1).replace(".",",") : "0";
  let h = `<div class="end"><span class="qnum">RESULTADO</span><p class="big">${nota}<span style="font-size:.4em;color:var(--muted)"> / 10</span></p>
    <p>${c.ok} bien y ${c.bad} mal de ${c.total} preguntas${pend?` (${pend} sin responder)`:""}.</p>`;
  if(fails.length){
    h += `<p class="grid-title">Las que has fallado</p><ul>` + fails.map(i=>`<li><button data-go="${st.order.indexOf(i)}">${esc(P[i].q)}</button></li>`).join("") + `</ul>`;
  }
  h += `<div class="nav"><button class="btn ghost" id="prev">Volver a la última</button>
    ${fails.length?`<button class="btn" id="retry">Repetir las ${fails.length} falladas</button>`:`<button class="btn" id="again">Volver a empezar</button>`}</div></div>`;
  sheet.innerHTML = h;
}
function answer(j){
  if(st.pos>=st.order.length || st.corregido) return;
  const i = st.order[st.pos]; if(showing() && (i in st.ans)) return;
  st.ans[i] = j; render();
}
function answerKey(d){
  if(st.pos>=st.order.length) return;
  answer(perm[st.order[st.pos]][d]);
}
function next(){ if(st.pos < st.order.length) { st.pos++; render(); window.scrollTo({top:0}); } }

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.t!==undefined){ st.tema=+t.dataset.t; st.ans={}; buildOrder(); render(); return; }
  if(t.id==="mEst"||t.id==="mExa"){ st.mode = t.id==="mEst"?"estudio":"examen"; st.ans={}; buildOrder(); render(); return; }
  if(t.id==="corregir"){ st.corregido=true; render(); return; }
  if(t.id==="shuf"){ st.shuffle=!st.shuffle; st.ans={}; buildOrder(); render(); return; }
  if(t.dataset.j!==undefined){ answer(+t.dataset.j); return; }
  if(t.dataset.n!==undefined){ st.pos=+t.dataset.n; render(); return; }
  if(t.dataset.go!==undefined){ st.pos=+t.dataset.go; render(); return; }
  if(t.id==="next"){ next(); return; }
  if(t.id==="prev"){ st.pos=Math.max(0, Math.min(st.pos, st.order.length)-1); render(); return; }
  if(t.id==="retry"){ const f = st.order.filter(i => st.ans[i]!==P[i].k); f.forEach(i=>delete st.ans[i]); buildOrder(f); render(); return; }
  if(t.id==="again"||t.id==="reset"){ st.ans={}; buildOrder(); render(); return; }
});
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==="a"||k==="1") answerKey(0); else if(k==="b"||k==="2") answerKey(1); else if(k==="c"||k==="3") answerKey(2);
  else if(k==="enter" && !e.target.closest("button")){ const i=st.order[st.pos]; if(st.pos<st.order.length && (i in st.ans || st.corregido)){ e.preventDefault(); next(); } }
});

load();
